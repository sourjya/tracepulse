<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>

  <rect width="960" height="360" rx="16" fill="url(#bg3)"/>

  <text x="480" y="36" text-anchor="middle" fill="#f8fafc" font-size="18" font-weight="700" letter-spacing="0.5">THE EDIT-VERIFY LOOP</text>
  <line x1="40" y1="50" x2="920" y2="50" stroke="#334155" stroke-width="1"/>

  <!-- Step 1: Edit -->
  <rect x="40" y="80" width="160" height="80" rx="8" fill="#1e293b" stroke="#f97316" stroke-width="2"/>
  <text x="120" y="110" text-anchor="middle" fill="#fb923c" font-size="14" font-weight="700">1. EDIT</text>
  <text x="120" y="130" text-anchor="middle" fill="#94a3b8" font-size="10">Agent changes</text>
  <text x="120" y="144" text-anchor="middle" fill="#94a3b8" font-size="10">source code</text>

  <!-- Arrow -->
  <path d="M 210 120 L 250 120" stroke="#475569" stroke-width="2" fill="none"/>
  <polygon points="250,115 260,120 250,125" fill="#475569"/>

  <!-- Step 2: Server reloads -->
  <rect x="270" y="80" width="160" height="80" rx="8" fill="#1e293b" stroke="#eab308" stroke-width="2"/>
  <text x="350" y="110" text-anchor="middle" fill="#facc15" font-size="14" font-weight="700">2. RELOAD</text>
  <text x="350" y="130" text-anchor="middle" fill="#94a3b8" font-size="10">Dev server detects</text>
  <text x="350" y="144" text-anchor="middle" fill="#94a3b8" font-size="10">change, hot-reloads</text>

  <!-- Arrow -->
  <path d="M 440 120 L 480 120" stroke="#475569" stroke-width="2" fill="none"/>
  <polygon points="480,115 490,120 480,125" fill="#475569"/>

  <!-- Step 3: TracePulse parses -->
  <rect x="500" y="80" width="160" height="80" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
  <text x="580" y="110" text-anchor="middle" fill="#60a5fa" font-size="14" font-weight="700">3. PARSE</text>
  <text x="580" y="130" text-anchor="middle" fill="#94a3b8" font-size="10">TracePulse parses</text>
  <text x="580" y="144" text-anchor="middle" fill="#94a3b8" font-size="10">errors, scores 0-100</text>

  <!-- Arrow -->
  <path d="M 670 120 L 710 120" stroke="#475569" stroke-width="2" fill="none"/>
  <polygon points="710,115 720,120 710,125" fill="#475569"/>

  <!-- Step 4: verify_fix -->
  <rect x="730" y="80" width="190" height="80" rx="8" fill="#1e293b" stroke="#22c55e" stroke-width="2"/>
  <text x="825" y="110" text-anchor="middle" fill="#4ade80" font-size="14" font-weight="700">4. VERIFY</text>
  <text x="825" y="130" text-anchor="middle" fill="#94a3b8" font-size="10">verify_fix(10) returns</text>
  <text x="825" y="144" text-anchor="middle" fill="#94a3b8" font-size="10">PASS or FAIL</text>

  <!-- PASS path -->
  <rect x="730" y="190" width="90" height="40" rx="6" fill="#14532d" stroke="#22c55e" stroke-width="1.5"/>
  <text x="775" y="215" text-anchor="middle" fill="#4ade80" font-size="13" font-weight="700">PASS</text>
  <path d="M 825 160 L 775 190" stroke="#22c55e" stroke-width="1.5" fill="none"/>

  <!-- FAIL path -->
  <rect x="840" y="190" width="80" height="40" rx="6" fill="#7f1d1d" stroke="#ef4444" stroke-width="1.5"/>
  <text x="880" y="215" text-anchor="middle" fill="#fca5a5" font-size="13" font-weight="700">FAIL</text>
  <path d="M 825 160 L 880 190" stroke="#ef4444" stroke-width="1.5" fill="none"/>

  <!-- PASS: done -->
  <text x="775" y="250" text-anchor="middle" fill="#4ade80" font-size="11" font-weight="600">Done! Move on.</text>

  <!-- FAIL: loop back -->
  <path d="M 880 230 L 880 280 L 120 280 L 120 160" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="6,3" fill="none"/>
  <polygon points="115,165 120,155 125,165" fill="#ef4444"/>
  <text x="500" y="296" text-anchor="middle" fill="#f87171" font-size="10">Fix the error, repeat from step 1</text>

  <!-- Bottom bar -->
  <rect x="40" y="315" width="880" height="32" rx="8" fill="#f97316" opacity="0.12"/>
  <text x="480" y="336" text-anchor="middle" fill="#fb923c" font-size="11" font-weight="600">ONE TOOL CALL (verify_fix) REPLACES: watch_for_errors + get_build_errors + get_errors = 3 CALLS SAVED PER CYCLE</text>
</svg>
