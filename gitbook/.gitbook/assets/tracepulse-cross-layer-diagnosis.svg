<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="bgcl" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>

  <rect width="960" height="420" rx="16" fill="url(#bgcl)"/>

  <text x="480" y="36" text-anchor="middle" fill="#f8fafc" font-size="18" font-weight="700" letter-spacing="0.5">CROSS-LAYER DIAGNOSIS: HOW IT WORKS</text>
  <line x1="40" y1="50" x2="920" y2="50" stroke="#334155" stroke-width="1"/>

  <!-- Step 1: Signal Sources -->
  <text x="480" y="75" text-anchor="middle" fill="#94a3b8" font-size="11">Agent calls get_cross_layer_diagnosis() → TracePulse collects signals from all layers simultaneously</text>

  <!-- Signal source boxes -->
  <rect x="40" y="95" width="200" height="70" rx="8" fill="#1e293b" stroke="#f97316" stroke-width="1.5"/>
  <text x="140" y="118" text-anchor="middle" fill="#fb923c" font-size="11" font-weight="700">Backend Signals</text>
  <text x="140" y="136" text-anchor="middle" fill="#94a3b8" font-size="9">HTTP 200, 401, 422, 429, 500</text>
  <text x="140" y="150" text-anchor="middle" fill="#94a3b8" font-size="9">Exceptions, repeated errors</text>

  <rect x="260" y="95" width="200" height="70" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="360" y="118" text-anchor="middle" fill="#60a5fa" font-size="11" font-weight="700">Frontend Signals</text>
  <text x="360" y="136" text-anchor="middle" fill="#94a3b8" font-size="9">TypeErrors, HTTP failures</text>
  <text x="360" y="150" text-anchor="middle" fill="#94a3b8" font-size="9">Crash bridge events</text>

  <rect x="500" y="95" width="200" height="70" rx="8" fill="#1e293b" stroke="#22c55e" stroke-width="1.5"/>
  <text x="600" y="118" text-anchor="middle" fill="#4ade80" font-size="11" font-weight="700">Git Signals</text>
  <text x="600" y="136" text-anchor="middle" fill="#94a3b8" font-size="9">Changed files since last commit</text>
  <text x="600" y="150" text-anchor="middle" fill="#94a3b8" font-size="9">File paths + count</text>

  <rect x="720" y="95" width="200" height="70" rx="8" fill="#1e293b" stroke="#eab308" stroke-width="1.5"/>
  <text x="820" y="118" text-anchor="middle" fill="#facc15" font-size="11" font-weight="700">Process Signals</text>
  <text x="820" y="136" text-anchor="middle" fill="#94a3b8" font-size="9">Hot-reload timestamps</text>
  <text x="820" y="150" text-anchor="middle" fill="#94a3b8" font-size="9">Server restart state</text>

  <!-- Arrows down to pattern matching -->
  <line x1="140" y1="165" x2="140" y2="195" stroke="#f97316" stroke-width="1" opacity="0.6"/>
  <line x1="360" y1="165" x2="360" y2="195" stroke="#3b82f6" stroke-width="1" opacity="0.6"/>
  <line x1="600" y1="165" x2="600" y2="195" stroke="#22c55e" stroke-width="1" opacity="0.6"/>
  <line x1="820" y1="165" x2="820" y2="195" stroke="#eab308" stroke-width="1" opacity="0.6"/>

  <!-- Step 2: Pattern Matching -->
  <rect x="80" y="195" width="800" height="80" rx="10" fill="#1e293b" stroke="#a855f7" stroke-width="2"/>
  <text x="480" y="218" text-anchor="middle" fill="#c084fc" font-size="13" font-weight="700">Pattern Matching Engine (9 patterns)</text>

  <!-- Pattern examples -->
  <rect x="100" y="228" width="230" height="36" rx="6" fill="#a855f7" opacity="0.1" stroke="#a855f7" stroke-width="0.5"/>
  <text x="215" y="244" text-anchor="middle" fill="#e9d5ff" font-size="9" font-weight="600">Backend 200 + Frontend TypeError</text>
  <text x="215" y="258" text-anchor="middle" fill="#94a3b8" font-size="8">→ Response format mismatch</text>

  <rect x="345" y="228" width="230" height="36" rx="6" fill="#a855f7" opacity="0.1" stroke="#a855f7" stroke-width="0.5"/>
  <text x="460" y="244" text-anchor="middle" fill="#e9d5ff" font-size="9" font-weight="600">Git changed + No restart detected</text>
  <text x="460" y="258" text-anchor="middle" fill="#94a3b8" font-size="8">→ Server running stale code</text>

  <rect x="590" y="228" width="230" height="36" rx="6" fill="#a855f7" opacity="0.1" stroke="#a855f7" stroke-width="0.5"/>
  <text x="705" y="244" text-anchor="middle" fill="#e9d5ff" font-size="9" font-weight="600">Same error 3x in 5 minutes</text>
  <text x="705" y="258" text-anchor="middle" fill="#94a3b8" font-size="8">→ Not transient, investigate root cause</text>

  <!-- Arrow down to gating -->
  <line x1="480" y1="275" x2="480" y2="300" stroke="#a855f7" stroke-width="1.5"/>
  <polygon points="475,298 485,298 480,305" fill="#a855f7"/>

  <!-- Step 3: Output Gating -->
  <rect x="200" y="305" width="560" height="45" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
  <text x="480" y="325" text-anchor="middle" fill="#e2e8f0" font-size="11" font-weight="600">Output Gating (Quiet Agent Principle)</text>
  <text x="480" y="341" text-anchor="middle" fill="#94a3b8" font-size="9">2+ signals required  •  Confidence ≥ pattern floor  •  Missing data = blocked, not guessed</text>

  <!-- Arrow down to output -->
  <line x1="480" y1="350" x2="480" y2="370" stroke="#22c55e" stroke-width="1.5"/>
  <polygon points="475,368 485,368 480,375" fill="#22c55e"/>

  <!-- Step 4: Output -->
  <rect x="140" y="375" width="680" height="34" rx="8" fill="#22c55e" opacity="0.15" stroke="#22c55e" stroke-width="1.5"/>
  <text x="480" y="396" text-anchor="middle" fill="#4ade80" font-size="12" font-weight="700">Single Actionable Diagnosis + Confidence Score + Proposed Fix</text>
</svg>
