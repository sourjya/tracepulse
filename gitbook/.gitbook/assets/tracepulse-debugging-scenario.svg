<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="bgsc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>

  <rect width="960" height="500" rx="16" fill="url(#bgsc)"/>

  <text x="480" y="36" text-anchor="middle" fill="#f8fafc" font-size="18" font-weight="700" letter-spacing="0.5">DEBUGGING "THE FORM SUBMITS BUT NOTHING HAPPENS"</text>
  <text x="480" y="56" text-anchor="middle" fill="#94a3b8" font-size="11">How the three-layer stack solves a cross-layer bug in 4 tool calls</text>
  <line x1="40" y1="68" x2="920" y2="68" stroke="#334155" stroke-width="1"/>

  <!-- Timeline -->
  <line x1="80" y1="100" x2="80" y2="460" stroke="#334155" stroke-width="2"/>

  <!-- Step 1 -->
  <circle cx="80" cy="115" r="14" fill="#3b82f6"/>
  <text x="80" y="120" text-anchor="middle" fill="#fff" font-size="11" font-weight="700">1</text>
  <rect x="110" y="95" width="810" height="70" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="130" y="115" fill="#60a5fa" font-size="12" font-weight="700">Chrome DevTools MCP</text>
  <text x="350" y="115" fill="#94a3b8" font-size="10">list_network_requests()</text>
  <text x="130" y="135" fill="#e2e8f0" font-size="11">→ POST /api/items returned 200 OK</text>
  <text x="130" y="152" fill="#64748b" font-size="10">Agent thinks: "Backend succeeded... so why is the UI not updating?"</text>

  <!-- Step 2 -->
  <circle cx="80" cy="200" r="14" fill="#f97316"/>
  <text x="80" y="205" text-anchor="middle" fill="#fff" font-size="11" font-weight="700">2</text>
  <rect x="110" y="180" width="810" height="80" rx="8" fill="#1e293b" stroke="#f97316" stroke-width="1.5"/>
  <text x="130" y="200" fill="#fb923c" font-size="12" font-weight="700">TracePulse</text>
  <text x="280" y="200" fill="#94a3b8" font-size="10">get_cross_layer_diagnosis()</text>
  <text x="130" y="222" fill="#e2e8f0" font-size="11">→ Pattern matched: "backend-ok-frontend-error" (confidence: 85%)</text>
  <text x="130" y="240" fill="#4ade80" font-size="11" font-weight="600">→ Diagnosis: "Backend 200 OK but frontend threw TypeError. Response has unexpected shape."</text>
  <text x="130" y="254" fill="#c084fc" font-size="10">→ Proposed fix: "Check if API client unwraps response. Use resp.items not resp.data.items"</text>

  <!-- Step 3 -->
  <circle cx="80" cy="300" r="14" fill="#a855f7"/>
  <text x="80" y="305" text-anchor="middle" fill="#fff" font-size="11" font-weight="700">3</text>
  <rect x="110" y="280" width="810" height="60" rx="8" fill="#1e293b" stroke="#a855f7" stroke-width="1.5"/>
  <text x="130" y="300" fill="#c084fc" font-size="12" font-weight="700">Agent fixes the code</text>
  <text x="130" y="320" fill="#e2e8f0" font-size="11">→ Changes resp.data.items to resp.items in src/hooks/useItems.ts:47</text>
  <text x="130" y="334" fill="#64748b" font-size="10">Targeted fix in 30 seconds — no guessing, no wrong-layer debugging</text>

  <!-- Step 4 -->
  <circle cx="80" cy="385" r="14" fill="#22c55e"/>
  <text x="80" y="390" text-anchor="middle" fill="#fff" font-size="11" font-weight="700">4</text>
  <rect x="110" y="365" width="810" height="60" rx="8" fill="#1e293b" stroke="#22c55e" stroke-width="1.5"/>
  <text x="130" y="385" fill="#4ade80" font-size="12" font-weight="700">TracePulse</text>
  <text x="280" y="385" fill="#94a3b8" font-size="10">verify_fix()</text>
  <text x="130" y="405" fill="#4ade80" font-size="11" font-weight="600">→ PASS ✓ No new errors after hot-reload</text>
  <text x="130" y="419" fill="#64748b" font-size="10">Bug fixed. Total time: ~1 minute. Without the stack: 20+ minutes debugging wrong layer.</text>

  <!-- Bottom comparison -->
  <rect x="110" y="445" width="380" height="36" rx="6" fill="#dc2626" opacity="0.1" stroke="#dc2626" stroke-width="1"/>
  <text x="300" y="462" text-anchor="middle" fill="#fca5a5" font-size="10" font-weight="600">❌ Without stack: 20 min debugging React state (wrong layer)</text>
  <text x="300" y="475" text-anchor="middle" fill="#94a3b8" font-size="9">Agent sees 200 OK → assumes backend fine → debugs frontend state → stuck</text>

  <rect x="510" y="445" width="380" height="36" rx="6" fill="#22c55e" opacity="0.1" stroke="#22c55e" stroke-width="1"/>
  <text x="700" y="462" text-anchor="middle" fill="#86efac" font-size="10" font-weight="600">✅ With stack: 1 min targeted fix (right layer)</text>
  <text x="700" y="475" text-anchor="middle" fill="#94a3b8" font-size="9">Cross-layer diagnosis → identifies response shape mismatch → fix in 30s</text>
</svg>
