<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 680" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="pStart" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#ffedd5"/><stop offset="100%" stop-color="#fed7aa"/></linearGradient>
    <linearGradient id="pStep" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#f0f9ff"/><stop offset="100%" stop-color="#e0f2fe"/></linearGradient>
    <linearGradient id="pDecision" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#fef9c3"/><stop offset="100%" stop-color="#fef08a"/></linearGradient>
    <linearGradient id="pEnd" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#d1fae5"/><stop offset="100%" stop-color="#a7f3d0"/></linearGradient>
    <marker id="pArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#64748b"/></marker>
    <marker id="pArrowG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#16a34a"/></marker>
  </defs>

  <rect width="700" height="680" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>

  <!-- Step 1: Raw log line -->
  <rect x="225" y="15" width="250" height="40" rx="10" fill="url(#pStart)" stroke="#f97316"/>
  <text x="350" y="40" text-anchor="middle" font-size="13" font-weight="700" fill="#9a3412">Raw log line from dev server</text>

  <line x1="350" y1="55" x2="350" y2="75" stroke="#64748b" stroke-width="1.5" marker-end="url(#pArrow)"/>

  <!-- Step 2: Strip ANSI -->
  <rect x="245" y="78" width="210" height="36" rx="8" fill="url(#pStep)" stroke="#0ea5e9"/>
  <text x="350" y="101" text-anchor="middle" font-size="12" font-weight="600" fill="#0c4a6e">Strip ANSI color codes</text>

  <line x1="350" y1="114" x2="350" y2="134" stroke="#64748b" stroke-width="1.5" marker-end="url(#pArrow)"/>

  <!-- Step 3: Secret check (diamond) -->
  <polygon points="350,137 440,170 350,203 260,170" fill="url(#pDecision)" stroke="#eab308"/>
  <text x="350" y="174" text-anchor="middle" font-size="12" font-weight="600" fill="#854d0e">Contains secret?</text>

  <!-- Yes branch -->
  <line x1="440" y1="170" x2="540" y2="170" stroke="#64748b" stroke-width="1.5" marker-end="url(#pArrow)"/>
  <text x="480" y="163" font-size="11" fill="#dc2626" font-weight="600">Yes</text>
  <rect x="545" y="152" width="140" height="36" rx="8" fill="#fef2f2" stroke="#ef4444"/>
  <text x="615" y="175" text-anchor="middle" font-size="12" font-weight="600" fill="#991b1b">[REDACTED]</text>
  <!-- Rejoin -->
  <line x1="615" y1="188" x2="615" y2="230" stroke="#64748b" stroke-width="1.5"/>
  <line x1="615" y1="230" x2="355" y2="230" stroke="#64748b" stroke-width="1.5" marker-end="url(#pArrow)"/>

  <!-- No branch -->
  <line x1="350" y1="203" x2="350" y2="225" stroke="#64748b" stroke-width="1.5" marker-end="url(#pArrow)"/>
  <text x="365" y="218" font-size="11" fill="#16a34a" font-weight="600">No</text>

  <!-- Step 4: Hot-reload check -->
  <polygon points="350,228 450,261 350,294 250,261" fill="url(#pDecision)" stroke="#eab308"/>
  <text x="350" y="258" text-anchor="middle" font-size="11" font-weight="600" fill="#854d0e">Hot-reload</text>
  <text x="350" y="272" text-anchor="middle" font-size="11" font-weight="600" fill="#854d0e">pattern?</text>

  <!-- Yes: inject marker -->
  <line x1="450" y1="261" x2="540" y2="261" stroke="#64748b" stroke-width="1.5" marker-end="url(#pArrow)"/>
  <text x="485" y="254" font-size="11" fill="#16a34a" font-weight="600">Yes</text>
  <rect x="545" y="243" width="140" height="36" rx="8" fill="#f0fdf4" stroke="#22c55e"/>
  <text x="615" y="266" text-anchor="middle" font-size="11" font-weight="600" fill="#166534">Inject reload marker</text>
  <line x1="615" y1="279" x2="615" y2="320" stroke="#64748b" stroke-width="1.5"/>
  <line x1="615" y1="320" x2="355" y2="320" stroke="#64748b" stroke-width="1.5" marker-end="url(#pArrow)"/>

  <!-- No: continue -->
  <line x1="350" y1="294" x2="350" y2="315" stroke="#64748b" stroke-width="1.5" marker-end="url(#pArrow)"/>
  <text x="365" y="308" font-size="11" fill="#64748b" font-weight="600">No</text>

  <!-- Step 5: Try parsers -->
  <rect x="225" y="318" width="250" height="40" rx="8" fill="url(#pStep)" stroke="#0ea5e9"/>
  <text x="350" y="343" text-anchor="middle" font-size="13" font-weight="700" fill="#0c4a6e">Try 26 parsers</text>

  <!-- Match branch -->
  <line x1="475" y1="338" x2="540" y2="338" stroke="#64748b" stroke-width="1.5" marker-end="url(#pArrow)"/>
  <text x="500" y="330" font-size="10" fill="#16a34a" font-weight="600">Match</text>
  <rect x="545" y="318" width="140" height="50" rx="8" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="615" y="339" text-anchor="middle" font-size="11" font-weight="600" fill="#1e40af">Extract file, line,</text>
  <text x="615" y="355" text-anchor="middle" font-size="11" font-weight="600" fill="#1e40af">type, stack trace</text>

  <!-- No match branch -->
  <line x1="225" y1="338" x2="160" y2="338" stroke="#64748b" stroke-width="1.5" marker-end="url(#pArrowBack)"/>
  <defs><marker id="pArrowBack" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 Z" fill="#64748b"/></marker></defs>
  <text x="200" y="330" font-size="10" fill="#94a3b8" font-weight="600">No match</text>
  <rect x="20" y="318" width="135" height="40" rx="8" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="87" y="343" text-anchor="middle" font-size="11" font-weight="600" fill="#64748b">Store as raw info</text>

  <!-- Both converge to scoring -->
  <line x1="87" y1="358" x2="87" y2="420" stroke="#64748b" stroke-width="1.5"/>
  <line x1="87" y1="420" x2="295" y2="420" stroke="#64748b" stroke-width="1.5" marker-end="url(#pArrow)"/>
  <line x1="615" y1="368" x2="615" y2="420" stroke="#64748b" stroke-width="1.5"/>
  <line x1="615" y1="420" x2="405" y2="420" stroke="#64748b" stroke-width="1.5" marker-end="url(#pArrowBack)"/>

  <!-- Step 6: Score -->
  <rect x="250" y="400" width="200" height="44" rx="8" fill="#ede9fe" stroke="#8b5cf6"/>
  <text x="350" y="420" text-anchor="middle" font-size="13" font-weight="700" fill="#5b21b6">Signal Score 0-100</text>
  <text x="350" y="436" text-anchor="middle" font-size="10" fill="#7c3aed">high / medium / low</text>

  <line x1="350" y1="444" x2="350" y2="470" stroke="#64748b" stroke-width="1.5" marker-end="url(#pArrow)"/>

  <!-- Step 7: Ring buffer -->
  <rect x="225" y="473" width="250" height="44" rx="8" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="350" y="493" text-anchor="middle" font-size="13" font-weight="700" fill="#1e40af">Ring Buffer</text>
  <text x="350" y="509" text-anchor="middle" font-size="10" fill="#2563eb">500 events max, oldest evicted</text>

  <line x1="350" y1="517" x2="350" y2="543" stroke="#16a34a" stroke-width="2" marker-end="url(#pArrowG)"/>

  <!-- Step 8: MCP tools -->
  <rect x="200" y="546" width="300" height="44" rx="10" fill="url(#pEnd)" stroke="#16a34a"/>
  <text x="350" y="566" text-anchor="middle" font-size="14" font-weight="800" fill="#14532d">Available via 36 MCP tools</text>
  <text x="350" y="582" text-anchor="middle" font-size="10" fill="#166534">get_errors, verify_fix, watch_for_errors, ...</text>

  <!-- Legend -->
  <rect x="20" y="620" width="660" height="44" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <rect x="35" y="635" width="14" height="14" rx="3" fill="url(#pStart)" stroke="#f97316"/>
  <text x="55" y="647" font-size="10" fill="#64748b">Input</text>
  <rect x="105" y="635" width="14" height="14" rx="3" fill="url(#pStep)" stroke="#0ea5e9"/>
  <text x="125" y="647" font-size="10" fill="#64748b">Processing</text>
  <rect x="200" y="635" width="14" height="14" rx="3" fill="url(#pDecision)" stroke="#eab308"/>
  <text x="220" y="647" font-size="10" fill="#64748b">Decision</text>
  <rect x="290" y="635" width="14" height="14" rx="3" fill="#ede9fe" stroke="#8b5cf6"/>
  <text x="310" y="647" font-size="10" fill="#64748b">Scoring</text>
  <rect x="370" y="635" width="14" height="14" rx="3" fill="url(#pEnd)" stroke="#16a34a"/>
  <text x="390" y="647" font-size="10" fill="#64748b">Output</text>
</svg>
