<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="wasteBg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#fef2f2"/><stop offset="100%" stop-color="#fee2e2"/></linearGradient>
    <linearGradient id="saveBg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#f0fdf4"/><stop offset="100%" stop-color="#dcfce7"/></linearGradient>
    <linearGradient id="barWaste" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#ef4444"/><stop offset="100%" stop-color="#dc2626"/></linearGradient>
    <linearGradient id="barSave" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#22c55e"/><stop offset="100%" stop-color="#16a34a"/></linearGradient>
  </defs>

  <rect width="960" height="720" rx="16" fill="#fafafa" stroke="#e5e7eb"/>

  <!-- Title -->
  <text x="480" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#111827">The Hidden Cost of Blind Agentic Coding</text>
  <text x="480" y="58" text-anchor="middle" font-size="13" fill="#6b7280">Every wasted token = wasted compute = wasted energy = avoidable carbon emissions</text>

  <!-- LEFT: Without TracePulse -->
  <rect x="20" y="78" width="450" height="520" rx="12" fill="url(#wasteBg)" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="245" y="103" text-anchor="middle" font-size="16" font-weight="700" fill="#dc2626">Without TracePulse</text>
  <text x="245" y="120" text-anchor="middle" font-size="12" fill="#991b1b">Agent iterates blind - reads, guesses, repeats</text>

  <!-- Bar 1: Tokens -->
  <text x="40" y="148" font-size="12" font-weight="600" fill="#7f1d1d">Tokens Per Error Investigation</text>
  <rect x="40" y="155" width="410" height="26" rx="5" fill="url(#barWaste)" opacity="0.9"/>
  <text x="50" y="173" font-size="13" font-weight="700" fill="white">~12,000 tokens</text>
  <text x="440" y="173" text-anchor="end" font-size="12" fill="white" opacity="0.85">23 file-read calls avg*</text>

  <!-- Bar 2: Session budget -->
  <text x="40" y="200" font-size="12" font-weight="600" fill="#7f1d1d">Session Token Budget (arXiv 2601.14470)</text>
  <rect x="40" y="207" width="410" height="26" rx="5" fill="#fecaca"/>
  <rect x="40" y="207" width="244" height="26" rx="5" fill="url(#barWaste)" opacity="0.8"/>
  <text x="50" y="225" font-size="13" font-weight="600" fill="white">59.4% wasted</text>
  <text x="300" y="225" font-size="12" fill="#991b1b">re-reading own work</text>

  <!-- Bar 3: Debug time -->
  <text x="40" y="252" font-size="12" font-weight="600" fill="#7f1d1d">Debug Time Per Session</text>
  <rect x="40" y="259" width="410" height="26" rx="5" fill="url(#barWaste)" opacity="0.7"/>
  <text x="50" y="277" font-size="13" font-weight="700" fill="white">30+ minutes</text>
  <text x="440" y="277" text-anchor="end" font-size="12" fill="white" opacity="0.85">manual log reading</text>

  <!-- Bar 4: Cost -->
  <text x="40" y="304" font-size="12" font-weight="600" fill="#7f1d1d">Monthly API Cost (Morph 2026)</text>
  <rect x="40" y="311" width="410" height="26" rx="5" fill="url(#barWaste)" opacity="0.6"/>
  <text x="50" y="329" font-size="13" font-weight="700" fill="white">$500 - $2,000</text>
  <text x="440" y="329" text-anchor="end" font-size="12" fill="white" opacity="0.85">unsteered agents</text>

  <!-- Environmental box -->
  <rect x="40" y="352" width="410" height="230" rx="8" fill="#7f1d1d" opacity="0.9"/>
  <text x="245" y="376" text-anchor="middle" font-size="14" font-weight="700" fill="#fecaca">Environmental Cost of AI Compute</text>

  <text x="60" y="404" font-size="13" fill="#fca5a5">DC demand by 2030 (IEA):</text>
  <text x="430" y="404" text-anchor="end" font-size="13" font-weight="700" fill="white">945 TWh</text>

  <text x="60" y="428" font-size="13" fill="#fca5a5">DC power growth (Goldman Sachs):</text>
  <text x="430" y="428" text-anchor="end" font-size="13" font-weight="700" fill="white">+160%</text>

  <text x="60" y="452" font-size="13" fill="#fca5a5">AI inference share (arXiv):</text>
  <text x="430" y="452" text-anchor="end" font-size="13" font-weight="700" fill="white">&gt;90%</text>

  <text x="60" y="476" font-size="13" fill="#fca5a5">DC CO2 by 2035 (IEA):</text>
  <text x="430" y="476" text-anchor="end" font-size="13" font-weight="700" fill="white">300-320M t</text>

  <text x="245" y="504" text-anchor="middle" font-size="10" fill="#fca5a5" opacity="0.7">Sources: IEA 2025, Goldman Sachs Research,</text>
  <text x="245" y="518" text-anchor="middle" font-size="10" fill="#fca5a5" opacity="0.7">arXiv 2512.03024</text>

  <!-- RIGHT: With TracePulse -->
  <rect x="490" y="78" width="450" height="520" rx="12" fill="url(#saveBg)" stroke="#86efac" stroke-width="1.5"/>
  <text x="715" y="103" text-anchor="middle" font-size="16" font-weight="700" fill="#16a34a">With TracePulse</text>
  <text x="715" y="120" text-anchor="middle" font-size="12" fill="#166534">Structured feedback - one call, exact answer</text>

  <!-- Save bar 1 -->
  <text x="510" y="148" font-size="12" font-weight="600" fill="#14532d">Tokens Per Error (measured)</text>
  <rect x="510" y="155" width="34" height="26" rx="5" fill="url(#barSave)"/>
  <text x="554" y="173" font-size="13" font-weight="700" fill="#16a34a">~1,000 tokens</text>
  <text x="920" y="173" text-anchor="end" font-size="13" font-weight="800" fill="#16a34a">92% fewer</text>

  <!-- Save bar 2 -->
  <text x="510" y="200" font-size="12" font-weight="600" fill="#14532d">Debug Time (measured)</text>
  <rect x="510" y="207" width="68" height="26" rx="5" fill="url(#barSave)" opacity="0.9"/>
  <text x="588" y="225" font-size="13" font-weight="700" fill="#16a34a">under 5 min</text>
  <text x="920" y="225" text-anchor="end" font-size="13" font-weight="800" fill="#16a34a">80%+ faster</text>

  <!-- Save bar 3 -->
  <text x="510" y="252" font-size="12" font-weight="600" fill="#14532d">Monthly Cost (projected)</text>
  <rect x="510" y="259" width="136" height="26" rx="5" fill="url(#barSave)" opacity="0.7"/>
  <text x="520" y="277" font-size="13" font-weight="700" fill="white">$50 - $200</text>
  <text x="920" y="277" text-anchor="end" font-size="12" fill="#16a34a">projected, 92% token savings</text>

  <!-- Save bar 4 -->
  <text x="510" y="304" font-size="12" font-weight="600" fill="#14532d">Bugs Caught (measured)</text>
  <rect x="510" y="311" width="100" height="26" rx="5" fill="url(#barSave)" opacity="0.8"/>
  <text x="520" y="329" font-size="13" font-weight="700" fill="white">3 real bugs</text>
  <text x="920" y="329" text-anchor="end" font-size="12" fill="#16a34a">agents would have missed</text>

  <!-- Planet box -->
  <rect x="510" y="352" width="410" height="230" rx="8" fill="#14532d" opacity="0.9"/>
  <text x="715" y="376" text-anchor="middle" font-size="14" font-weight="700" fill="#bbf7d0">What This Means for the Planet</text>

  <text x="530" y="404" font-size="13" fill="#86efac">Fewer tokens per error:</text>
  <text x="900" y="404" text-anchor="end" font-size="13" font-weight="700" fill="white">12x less</text>

  <text x="530" y="428" font-size="13" fill="#86efac">Fewer GPU inference cycles:</text>
  <text x="900" y="428" text-anchor="end" font-size="13" font-weight="700" fill="white">12x less</text>

  <text x="530" y="452" font-size="13" fill="#86efac">Less data center energy:</text>
  <text x="900" y="452" text-anchor="end" font-size="13" font-weight="700" fill="white">12x less</text>

  <text x="530" y="476" font-size="13" fill="#86efac">Less carbon emitted:</text>
  <text x="900" y="476" text-anchor="end" font-size="13" font-weight="700" fill="white">12x less</text>

  <text x="715" y="504" text-anchor="middle" font-size="10" fill="#86efac" opacity="0.7">Measured in live sessions. *IDE.com 42-session study.</text>
  <text x="715" y="518" text-anchor="middle" font-size="10" fill="#86efac" opacity="0.7">Token-to-compute ratio is 1:1.</text>

  <!-- Bottom: Scale calculation -->
  <rect x="20" y="615" width="920" height="90" rx="10" fill="#f3f4f6" stroke="#d1d5db"/>
  <text x="480" y="640" text-anchor="middle" font-size="15" font-weight="700" fill="#374151">At Scale: Token Savings Calculation</text>
  <text x="480" y="662" text-anchor="middle" font-size="12" fill="#4b5563">1,000 devs x 10 sessions/wk x 5 errors/session x 11,000 tokens saved/error = 550M tokens/wk saved</text>
  <text x="480" y="682" text-anchor="middle" font-size="12" fill="#4b5563">At $0.003/1K input tokens (Claude Sonnet): ~$1,650/wk = ~$85,800/year in token costs alone</text>
</svg>
