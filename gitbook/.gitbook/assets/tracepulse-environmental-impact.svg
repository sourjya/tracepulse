<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="wasteBg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#fef2f2"/><stop offset="100%" stop-color="#fee2e2"/></linearGradient>
    <linearGradient id="saveBg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#f0fdf4"/><stop offset="100%" stop-color="#dcfce7"/></linearGradient>
    <linearGradient id="barWaste" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#ef4444"/><stop offset="100%" stop-color="#dc2626"/></linearGradient>
    <linearGradient id="barSave" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#22c55e"/><stop offset="100%" stop-color="#16a34a"/></linearGradient>
  </defs>

  <rect width="1000" height="700" rx="16" fill="#fafafa" stroke="#e5e7eb"/>

  <!-- Title -->
  <text x="500" y="40" text-anchor="middle" font-size="22" font-weight="700" fill="#111827">The Hidden Cost of Blind Agentic Coding</text>
  <text x="500" y="62" text-anchor="middle" font-size="14" fill="#6b7280">Every wasted token = wasted compute = wasted energy = avoidable carbon emissions</text>

  <!-- LEFT: Without TracePulse -->
  <rect x="25" y="85" width="465" height="510" rx="12" fill="url(#wasteBg)" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="257" y="112" text-anchor="middle" font-size="16" font-weight="700" fill="#dc2626">Without TracePulse</text>
  <text x="257" y="130" text-anchor="middle" font-size="11" fill="#991b1b">Agent iterates blind - reads, guesses, repeats</text>

  <!-- Waste bars -->
  <text x="45" y="165" font-size="11" font-weight="600" fill="#7f1d1d">Tokens Per Error Investigation</text>
  <rect x="45" y="175" width="425" height="28" rx="6" fill="url(#barWaste)" opacity="0.9"/>
  <text x="55" y="194" font-size="13" font-weight="700" fill="white">~12,000 tokens</text>
  <text x="360" y="194" font-size="10" fill="white" opacity="0.8">23 file-read calls avg*</text>

  <text x="45" y="225" font-size="11" font-weight="600" fill="#7f1d1d">Session Token Budget (arXiv 2601.14470)</text>
  <rect x="45" y="235" width="425" height="28" rx="6" fill="#fecaca"/>
  <rect x="45" y="235" width="253" height="28" rx="6" fill="url(#barWaste)" opacity="0.8"/>
  <text x="55" y="254" font-size="12" font-weight="600" fill="white">59.4% wasted</text>
  <text x="310" y="254" font-size="11" fill="#991b1b">re-reading own work</text>

  <text x="45" y="285" font-size="11" font-weight="600" fill="#7f1d1d">Debug Time Per Session</text>
  <rect x="45" y="295" width="425" height="28" rx="6" fill="url(#barWaste)" opacity="0.7"/>
  <text x="55" y="314" font-size="13" font-weight="700" fill="white">30+ minutes</text>
  <text x="320" y="314" font-size="10" fill="white" opacity="0.8">manual log reading</text>

  <text x="45" y="345" font-size="11" font-weight="600" fill="#7f1d1d">Monthly API Cost (Morph 2026)</text>
  <rect x="45" y="355" width="425" height="28" rx="6" fill="url(#barWaste)" opacity="0.6"/>
  <text x="55" y="374" font-size="13" font-weight="700" fill="white">$500 - $2,000</text>
  <text x="320" y="374" font-size="10" fill="white" opacity="0.8">unsteered agents</text>

  <!-- Environmental impact box - wider padding -->
  <rect x="45" y="400" width="425" height="180" rx="8" fill="#7f1d1d" opacity="0.9"/>
  <text x="257" y="425" text-anchor="middle" font-size="14" font-weight="700" fill="#fecaca">Environmental Cost of AI Compute</text>

  <text x="65" y="455" font-size="12" fill="#fca5a5">DC demand by 2030 (IEA):</text>
  <text x="420" y="455" text-anchor="end" font-size="14" font-weight="700" fill="white">945 TWh</text>

  <text x="65" y="481" font-size="12" fill="#fca5a5">DC power growth (Goldman Sachs):</text>
  <text x="420" y="481" text-anchor="end" font-size="14" font-weight="700" fill="white">+160%</text>

  <text x="65" y="507" font-size="12" fill="#fca5a5">AI inference share (arXiv):</text>
  <text x="420" y="507" text-anchor="end" font-size="14" font-weight="700" fill="white">>90%</text>

  <text x="65" y="533" font-size="12" fill="#fca5a5">DC CO2 by 2035 (IEA):</text>
  <text x="420" y="533" text-anchor="end" font-size="14" font-weight="700" fill="white">300-320M t</text>

  <text x="257" y="568" text-anchor="middle" font-size="10" fill="#fca5a5" opacity="0.8">Sources: IEA 2025, Goldman Sachs Research, arXiv 2512.03024</text>

  <!-- RIGHT: With TracePulse -->
  <rect x="510" y="85" width="465" height="510" rx="12" fill="url(#saveBg)" stroke="#86efac" stroke-width="1.5"/>
  <text x="742" y="112" text-anchor="middle" font-size="16" font-weight="700" fill="#16a34a">With TracePulse</text>
  <text x="742" y="130" text-anchor="middle" font-size="11" fill="#166534">Structured feedback - one call, exact answer</text>

  <!-- Save bars -->
  <text x="530" y="165" font-size="11" font-weight="600" fill="#14532d">Tokens Per Error (measured)</text>
  <rect x="530" y="175" width="35" height="28" rx="6" fill="url(#barSave)"/>
  <text x="575" y="194" font-size="13" font-weight="700" fill="#16a34a">~1,000 tokens</text>
  <text x="750" y="194" font-size="13" font-weight="800" fill="#16a34a">92% fewer</text>

  <text x="530" y="225" font-size="11" font-weight="600" fill="#14532d">Debug Time (measured)</text>
  <rect x="530" y="235" width="70" height="28" rx="6" fill="url(#barSave)" opacity="0.9"/>
  <text x="610" y="254" font-size="13" font-weight="700" fill="#16a34a">under 5 min</text>
  <text x="780" y="254" font-size="13" font-weight="800" fill="#16a34a">80%+ faster</text>

  <text x="530" y="285" font-size="11" font-weight="600" fill="#14532d">Monthly Cost (projected)</text>
  <rect x="530" y="295" width="140" height="28" rx="6" fill="url(#barSave)" opacity="0.7"/>
  <text x="540" y="314" font-size="13" font-weight="700" fill="white">$50 - $200</text>
  <text x="710" y="314" font-size="11" fill="#16a34a">projected, 92% token savings</text>

  <text x="530" y="345" font-size="11" font-weight="600" fill="#14532d">Bugs Caught (measured)</text>
  <rect x="530" y="355" width="105" height="28" rx="6" fill="url(#barSave)" opacity="0.8"/>
  <text x="540" y="374" font-size="13" font-weight="700" fill="white">3 real bugs</text>
  <text x="710" y="374" font-size="11" fill="#16a34a">agents would have missed</text>

  <!-- Positive impact box - wider padding -->
  <rect x="530" y="400" width="425" height="180" rx="8" fill="#14532d" opacity="0.9"/>
  <text x="742" y="425" text-anchor="middle" font-size="14" font-weight="700" fill="#bbf7d0">What This Means for the Planet</text>

  <text x="550" y="455" font-size="13" fill="#86efac">Fewer tokens per error:</text>
  <text x="905" y="455" text-anchor="end" font-size="15" font-weight="700" fill="white">12x less</text>

  <text x="550" y="485" font-size="13" fill="#86efac">Fewer GPU inference cycles:</text>
  <text x="905" y="485" text-anchor="end" font-size="15" font-weight="700" fill="white">12x less</text>

  <text x="550" y="515" font-size="13" fill="#86efac">Less data center energy:</text>
  <text x="905" y="515" text-anchor="end" font-size="15" font-weight="700" fill="white">12x less</text>

  <text x="550" y="545" font-size="13" fill="#86efac">Less carbon emitted:</text>
  <text x="905" y="545" text-anchor="end" font-size="15" font-weight="700" fill="white">12x less</text>

  <text x="742" y="572" text-anchor="middle" font-size="10" fill="#86efac" opacity="0.8">Measured in live sessions. *IDE.com 42-session study. Token-to-compute is 1:1.</text>

  <!-- Bottom: Scale calculation - LARGER TEXT -->
  <rect x="25" y="610" width="950" height="76" rx="10" fill="#f3f4f6" stroke="#d1d5db"/>
  <text x="500" y="634" text-anchor="middle" font-size="14" font-weight="700" fill="#374151">At Scale: Token Savings Calculation</text>
  <text x="500" y="656" text-anchor="middle" font-size="13" fill="#4b5563">1,000 devs x 10 sessions/wk x 5 errors/session x 11,000 tokens saved/error = 550M tokens/wk saved</text>
  <text x="500" y="676" text-anchor="middle" font-size="13" fill="#4b5563">At $0.003/1K input tokens (Claude Sonnet): ~$1,650/wk = ~$85,800/year in token costs alone</text>
</svg>
