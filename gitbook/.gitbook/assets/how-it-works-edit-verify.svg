<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 420" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <filter id="eShadow"><feDropShadow dx="0" dy="1" stdDeviation="2" flood-opacity="0.08"/></filter>
  </defs>

  <rect width="700" height="420" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>

  <!-- Column headers -->
  <rect x="60" y="15" width="130" height="32" rx="6" fill="#d1fae5" stroke="#16a34a"/>
  <text x="125" y="36" text-anchor="middle" font-size="13" font-weight="700" fill="#14532d">AI Agent</text>

  <rect x="280" y="15" width="130" height="32" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="345" y="36" text-anchor="middle" font-size="13" font-weight="700" fill="#1e40af">TracePulse</text>

  <rect x="500" y="15" width="140" height="32" rx="6" fill="#ffedd5" stroke="#f59e0b"/>
  <text x="570" y="36" text-anchor="middle" font-size="13" font-weight="700" fill="#92400e">Dev Server</text>

  <!-- Lifelines -->
  <line x1="125" y1="50" x2="125" y2="400" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.4"/>
  <line x1="345" y1="50" x2="345" y2="400" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.4"/>
  <line x1="570" y1="50" x2="570" y2="400" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.4"/>

  <!-- Loop box -->
  <rect x="30" y="60" width="640" height="330" rx="8" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="30" y="60" width="120" height="24" rx="4" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="90" y="77" text-anchor="middle" font-size="11" font-weight="700" fill="#475569">loop until fixed</text>

  <!-- Step 1: Agent edits code -->
  <rect x="65" y="100" width="120" height="30" rx="6" fill="#d1fae5" stroke="#16a34a" filter="url(#eShadow)"/>
  <text x="125" y="120" text-anchor="middle" font-size="12" font-weight="600" fill="#14532d">Edit code</text>

  <!-- Step 2: Agent calls verify_fix -->
  <line x1="125" y1="145" x2="340" y2="145" stroke="#16a34a" stroke-width="2" marker-end="url(#eArrowG)"/>
  <defs><marker id="eArrowG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#16a34a"/></marker></defs>
  <rect x="155" y="133" width="130" height="20" rx="4" fill="white" stroke="#d1d5db"/>
  <text x="220" y="148" text-anchor="middle" font-size="11" font-weight="600" fill="#166534">verify_fix(10)</text>

  <!-- Step 3: TP watches -->
  <rect x="305" y="165" width="80" height="70" rx="4" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="345" y="185" text-anchor="middle" font-size="10" fill="#1e40af" font-weight="600">Watching</text>
  <text x="345" y="200" text-anchor="middle" font-size="10" fill="#1e40af">10 seconds</text>
  <text x="345" y="215" text-anchor="middle" font-size="10" fill="#1e40af">...</text>

  <!-- Step 4: Server hot-reloads -->
  <line x1="570" y1="185" x2="390" y2="185" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#eArrowA)"/>
  <defs><marker id="eArrowA" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 Z" fill="#f59e0b"/></marker></defs>
  <text x="480" y="180" text-anchor="middle" font-size="10" fill="#92400e" font-weight="600">Hot-reload event</text>

  <!-- Step 5: Server sends errors (if any) -->
  <line x1="570" y1="215" x2="390" y2="215" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#eArrowR)"/>
  <defs><marker id="eArrowR" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 Z" fill="#ef4444"/></marker></defs>
  <text x="480" y="210" text-anchor="middle" font-size="10" fill="#dc2626" font-weight="600">Errors (if any)</text>

  <!-- Step 6: TP returns verdict -->
  <line x1="345" y1="260" x2="130" y2="260" stroke="#3b82f6" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#eArrowBBack)"/>
  <defs><marker id="eArrowBBack" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 Z" fill="#3b82f6"/></marker></defs>

  <!-- PASS/FAIL boxes -->
  <rect x="155" y="250" width="55" height="22" rx="4" fill="#d1fae5" stroke="#16a34a"/>
  <text x="182" y="265" text-anchor="middle" font-size="11" font-weight="700" fill="#16a34a">PASS</text>
  <text x="218" y="265" font-size="11" fill="#64748b">or</text>
  <rect x="232" y="250" width="50" height="22" rx="4" fill="#fef2f2" stroke="#ef4444"/>
  <text x="257" y="265" text-anchor="middle" font-size="11" font-weight="700" fill="#ef4444">FAIL</text>

  <!-- Outcome annotations -->
  <rect x="65" y="290" width="260" height="28" rx="6" fill="#f0fdf4" stroke="#86efac"/>
  <text x="195" y="309" text-anchor="middle" font-size="11" fill="#166534">PASS: no errors after reload - fix worked!</text>

  <rect x="65" y="328" width="260" height="28" rx="6" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="195" y="347" text-anchor="middle" font-size="11" fill="#991b1b">FAIL: errors found - agent loops back to edit</text>

  <!-- Right side: what TP checks -->
  <rect x="410" y="280" width="260" height="100" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="540" y="300" text-anchor="middle" font-size="12" font-weight="700" fill="#374151">What TracePulse checks:</text>
  <text x="430" y="320" font-size="11" fill="#64748b">- Hot-reload detected?</text>
  <text x="430" y="338" font-size="11" fill="#64748b">- New errors since call?</text>
  <text x="430" y="356" font-size="11" fill="#64748b">- Build errors cleared?</text>
  <text x="430" y="374" font-size="11" fill="#64748b">- Specific fingerprint resolved?</text>
</svg>
