<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="bg4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>

  <rect width="960" height="480" rx="16" fill="url(#bg4)"/>

  <text x="480" y="36" text-anchor="middle" fill="#f8fafc" font-size="18" font-weight="700" letter-spacing="0.5">THE THREE-LAYER AGENTIC DEBUGGING STACK</text>
  <line x1="40" y1="50" x2="920" y2="50" stroke="#334155" stroke-width="1"/>

  <!-- Agent at top -->
  <rect x="340" y="65" width="280" height="50" rx="8" fill="#1e293b" stroke="#e2e8f0" stroke-width="2"/>
  <text x="480" y="88" text-anchor="middle" fill="#f8fafc" font-size="14" font-weight="700">AI Coding Agent</text>
  <text x="480" y="104" text-anchor="middle" fill="#94a3b8" font-size="10">Kiro, Cursor, Claude Code, Copilot, Windsurf</text>

  <!-- Connecting lines -->
  <line x1="380" y1="115" x2="160" y2="150" stroke="#f97316" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="480" y1="115" x2="480" y2="150" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="580" y1="115" x2="800" y2="150" stroke="#22c55e" stroke-width="1.5" stroke-dasharray="4,3"/>

  <!-- Layer 1: TracePulse -->
  <rect x="40" y="150" width="280" height="180" rx="10" fill="#1e293b" stroke="#f97316" stroke-width="2"/>
  <rect x="40" y="150" width="280" height="32" rx="10" fill="#f97316" opacity="0.2"/>
  <text x="180" y="172" text-anchor="middle" fill="#fb923c" font-size="14" font-weight="700">🎧 Feedback Layer</text>

  <text x="180" y="200" text-anchor="middle" fill="#f8fafc" font-size="16" font-weight="800">TracePulse</text>

  <text x="60" y="224" fill="#94a3b8" font-size="10">✓ Server errors + stack traces</text>
  <text x="60" y="240" fill="#94a3b8" font-size="10">✓ Build failures (TS, ESLint, Vite)</text>
  <text x="60" y="256" fill="#94a3b8" font-size="10">✓ Test results (pytest, jest, vitest)</text>
  <text x="60" y="272" fill="#94a3b8" font-size="10">✓ Infrastructure health (DB, Redis)</text>
  <text x="60" y="288" fill="#94a3b8" font-size="10">✓ Cross-layer diagnosis (DevLoop)</text>
  <text x="60" y="304" fill="#94a3b8" font-size="10">✓ Git-aware error correlation</text>

  <text x="180" y="322" text-anchor="middle" fill="#fb923c" font-size="11" font-weight="600">42 tools | 26 parsers | 12x token savings</text>

  <!-- Layer 2: Chrome DevTools -->
  <rect x="340" y="150" width="280" height="180" rx="10" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
  <rect x="340" y="150" width="280" height="32" rx="10" fill="#3b82f6" opacity="0.2"/>
  <text x="480" y="172" text-anchor="middle" fill="#60a5fa" font-size="14" font-weight="700">🖐️ Action Layer</text>

  <text x="480" y="200" text-anchor="middle" fill="#f8fafc" font-size="16" font-weight="800">Chrome DevTools MCP</text>

  <text x="360" y="224" fill="#94a3b8" font-size="10">✓ Console messages + JS errors</text>
  <text x="360" y="240" fill="#94a3b8" font-size="10">✓ Network requests + responses</text>
  <text x="360" y="256" fill="#94a3b8" font-size="10">✓ Performance traces + Lighthouse</text>
  <text x="360" y="272" fill="#94a3b8" font-size="10">✓ DOM snapshots + screenshots</text>
  <text x="360" y="288" fill="#94a3b8" font-size="10">✓ Page interactions (click, fill, type)</text>
  <text x="360" y="304" fill="#94a3b8" font-size="10">✓ Memory snapshots + heap analysis</text>

  <text x="480" y="322" text-anchor="middle" fill="#60a5fa" font-size="11" font-weight="600">30+ tools | Official Google project</text>

  <!-- Layer 3: ViewGraph -->
  <rect x="640" y="150" width="280" height="180" rx="10" fill="#1e293b" stroke="#22c55e" stroke-width="2"/>
  <rect x="640" y="150" width="280" height="32" rx="10" fill="#22c55e" opacity="0.2"/>
  <text x="780" y="172" text-anchor="middle" fill="#4ade80" font-size="14" font-weight="700">👁️ Perception Layer</text>

  <text x="780" y="200" text-anchor="middle" fill="#f8fafc" font-size="16" font-weight="800">ViewGraph</text>

  <text x="660" y="224" fill="#94a3b8" font-size="10">✓ Structured DOM capture</text>
  <text x="660" y="240" fill="#94a3b8" font-size="10">✓ Accessibility auditing (WCAG)</text>
  <text x="660" y="256" fill="#94a3b8" font-size="10">✓ Layout + overflow detection</text>
  <text x="660" y="272" fill="#94a3b8" font-size="10">✓ User annotations + review mode</text>
  <text x="660" y="288" fill="#94a3b8" font-size="10">✓ Visual regression detection</text>
  <text x="660" y="304" fill="#94a3b8" font-size="10">✓ Design system consistency</text>

  <text x="780" y="322" text-anchor="middle" fill="#4ade80" font-size="11" font-weight="600">40+ tools | 97% token reduction</text>

  <!-- Cross-layer synthesis bar -->
  <rect x="40" y="350" width="880" height="50" rx="10" fill="#1e293b" stroke="#a855f7" stroke-width="2"/>
  <rect x="40" y="350" width="880" height="50" rx="10" fill="#a855f7" opacity="0.08"/>
  <text x="480" y="372" text-anchor="middle" fill="#c084fc" font-size="13" font-weight="700">⚡ Cross-Layer Synthesis: get_cross_layer_diagnosis</text>
  <text x="480" y="390" text-anchor="middle" fill="#94a3b8" font-size="10">Correlates all layers simultaneously → single actionable diagnosis → "Backend OK but frontend TypeError — check response parsing"</text>

  <!-- Bottom: The Application -->
  <rect x="140" y="418" width="680" height="44" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
  <text x="480" y="440" text-anchor="middle" fill="#64748b" font-size="12" font-weight="600">YOUR APPLICATION</text>
  <text x="480" y="454" text-anchor="middle" fill="#475569" font-size="10">Frontend (Browser)  ←→  Backend (Server)  ←→  Infrastructure (DB, Redis, APIs)</text>

  <!-- Arrows from layers to app -->
  <line x1="180" y1="330" x2="180" y2="418" stroke="#f97316" stroke-width="1" stroke-dasharray="3,3" opacity="0.5"/>
  <line x1="480" y1="330" x2="480" y2="418" stroke="#3b82f6" stroke-width="1" stroke-dasharray="3,3" opacity="0.5"/>
  <line x1="780" y1="330" x2="780" y2="418" stroke="#22c55e" stroke-width="1" stroke-dasharray="3,3" opacity="0.5"/>
</svg>
