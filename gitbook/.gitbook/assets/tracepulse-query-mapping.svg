<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" font-family="system-ui, -apple-system, sans-serif">
  <rect width="960" height="420" rx="16" fill="#fafafa" stroke="#e5e7eb"/>

  <text x="480" y="32" text-anchor="middle" font-size="18" font-weight="700" fill="#111">Talk to Your Agent, TracePulse Does the Rest</text>
  <text x="480" y="52" text-anchor="middle" font-size="12" fill="#6b7280">Natural language queries mapped to structured tool sequences</text>

  <!-- Row 1: Health queries -->
  <rect x="30" y="75" width="280" height="50" rx="8" fill="#e0e7ff" stroke="#818cf8"/>
  <text x="170" y="97" text-anchor="middle" font-size="12" font-weight="600" fill="#3730a3">"Is everything working?"</text>
  <text x="170" y="112" text-anchor="middle" font-size="10" fill="#6366f1">Developer asks naturally</text>

  <text x="330" y="100" font-size="18" fill="#94a3b8">-></text>

  <rect x="350" y="75" width="200" height="50" rx="8" fill="#16a34a" opacity="0.9"/>
  <text x="450" y="97" text-anchor="middle" font-size="11" font-weight="600" fill="white">get_project_health()</text>
  <text x="450" y="112" text-anchor="middle" font-size="9" fill="#bbf7d0">1 call, ~200 tokens</text>

  <text x="570" y="100" font-size="18" fill="#94a3b8">-></text>

  <rect x="590" y="75" width="340" height="50" rx="8" fill="#f0fdf4" stroke="#86efac"/>
  <text x="760" y="97" text-anchor="middle" font-size="11" fill="#166534">Server running, 0 errors, Redis reachable, alembic detected</text>
  <text x="760" y="112" text-anchor="middle" font-size="10" font-weight="600" fill="#16a34a">Complete picture in 2 seconds</text>

  <!-- Row 2: Audit query -->
  <rect x="30" y="140" width="280" height="50" rx="8" fill="#e0e7ff" stroke="#818cf8"/>
  <text x="170" y="162" text-anchor="middle" font-size="12" font-weight="600" fill="#3730a3">"Run a full project audit"</text>
  <text x="170" y="177" text-anchor="middle" font-size="10" fill="#6366f1">Pre-deploy or daily check</text>

  <text x="330" y="165" font-size="18" fill="#94a3b8">-></text>

  <rect x="350" y="140" width="580" height="50" rx="8" fill="#16a34a" opacity="0.85"/>
  <text x="640" y="157" text-anchor="middle" font-size="10" font-weight="600" fill="white">get_project_health() -> check_drift() -> get_error_clusters() -> get_perf_baseline()</text>
  <text x="640" y="175" text-anchor="middle" font-size="9" fill="#bbf7d0">4 tools, ~1,200 tokens total. Replaces 15+ minutes of manual checking.</text>

  <!-- Row 3: Fix verification -->
  <rect x="30" y="205" width="280" height="50" rx="8" fill="#e0e7ff" stroke="#818cf8"/>
  <text x="170" y="227" text-anchor="middle" font-size="12" font-weight="600" fill="#3730a3">"Did my fix work?"</text>
  <text x="170" y="242" text-anchor="middle" font-size="10" fill="#6366f1">After every code change</text>

  <text x="330" y="230" font-size="18" fill="#94a3b8">-></text>

  <rect x="350" y="205" width="200" height="50" rx="8" fill="#16a34a" opacity="0.8"/>
  <text x="450" y="227" text-anchor="middle" font-size="11" font-weight="600" fill="white">verify_fix(fingerprint)</text>
  <text x="450" y="242" text-anchor="middle" font-size="9" fill="#bbf7d0">1 call, pass/fail verdict</text>

  <text x="570" y="230" font-size="18" fill="#94a3b8">-></text>

  <rect x="590" y="205" width="340" height="50" rx="8" fill="#f0fdf4" stroke="#86efac"/>
  <text x="760" y="227" text-anchor="middle" font-size="11" fill="#166534">PASS - target error resolved (was 42 occurrences)</text>
  <text x="760" y="242" text-anchor="middle" font-size="10" font-weight="600" fill="#16a34a">Definitive, not "I think I fixed it"</text>

  <!-- Row 4: Investigation -->
  <rect x="30" y="270" width="280" height="50" rx="8" fill="#e0e7ff" stroke="#818cf8"/>
  <text x="170" y="292" text-anchor="middle" font-size="12" font-weight="600" fill="#3730a3">"What did I miss?"</text>
  <text x="170" y="307" text-anchor="middle" font-size="10" fill="#6366f1">End of session review</text>

  <text x="330" y="295" font-size="18" fill="#94a3b8">-></text>

  <rect x="350" y="270" width="200" height="50" rx="8" fill="#16a34a" opacity="0.75"/>
  <text x="450" y="292" text-anchor="middle" font-size="11" font-weight="600" fill="white">get_session_insights()</text>
  <text x="450" y="307" text-anchor="middle" font-size="9" fill="#bbf7d0">1 call, behavior analysis</text>

  <text x="570" y="295" font-size="18" fill="#94a3b8">-></text>

  <rect x="590" y="270" width="340" height="50" rx="8" fill="#f0fdf4" stroke="#86efac"/>
  <text x="760" y="292" text-anchor="middle" font-size="11" fill="#166534">2 uninvestigated errors, 1 verification gap, 45 tools called</text>
  <text x="760" y="307" text-anchor="middle" font-size="10" font-weight="600" fill="#16a34a">Catches what the agent forgot</text>

  <!-- Row 5: Impact -->
  <rect x="30" y="335" width="280" height="50" rx="8" fill="#e0e7ff" stroke="#818cf8"/>
  <text x="170" y="357" text-anchor="middle" font-size="12" font-weight="600" fill="#3730a3">"How much did we save?"</text>
  <text x="170" y="372" text-anchor="middle" font-size="10" fill="#6366f1">Token and environmental impact</text>

  <text x="330" y="360" font-size="18" fill="#94a3b8">-></text>

  <rect x="350" y="335" width="200" height="50" rx="8" fill="#16a34a" opacity="0.7"/>
  <text x="450" y="357" text-anchor="middle" font-size="11" font-weight="600" fill="white">get_session_impact()</text>
  <text x="450" y="372" text-anchor="middle" font-size="9" fill="#bbf7d0">1 call, environmental report</text>

  <text x="570" y="360" font-size="18" fill="#94a3b8">-></text>

  <rect x="590" y="335" width="340" height="50" rx="8" fill="#f0fdf4" stroke="#86efac"/>
  <text x="760" y="357" text-anchor="middle" font-size="11" fill="#166534">121K tokens saved, 25.7 Wh energy, 10.3g CO2 avoided</text>
  <text x="760" y="372" text-anchor="middle" font-size="10" font-weight="600" fill="#16a34a">Quantified environmental impact</text>

  <!-- Bottom -->
  <text x="480" y="410" text-anchor="middle" font-size="11" font-weight="600" fill="#374151">You speak naturally. The agent translates. TracePulse delivers structured answers.</text>
</svg>
