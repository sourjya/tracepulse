<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="beforeBg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#fef2f2"/><stop offset="100%" stop-color="#fee2e2"/></linearGradient>
    <linearGradient id="afterBg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#f0fdf4"/><stop offset="100%" stop-color="#dcfce7"/></linearGradient>
  </defs>

  <rect width="960" height="520" rx="16" fill="#fafafa" stroke="#e5e7eb"/>

  <!-- Title -->
  <text x="480" y="36" text-anchor="middle" font-size="20" font-weight="700" fill="#111">We Practice What We Preach</text>
  <text x="480" y="56" text-anchor="middle" font-size="13" fill="#6b7280">TracePulse cut its own schema overhead by 80%</text>

  <!-- LEFT CARD -->
  <rect x="25" y="75" width="420" height="420" rx="12" fill="url(#beforeBg)" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="235" y="100" text-anchor="middle" font-size="16" font-weight="700" fill="#dc2626">Before: 36 Individual Tools</text>

  <!-- 6x6 grid of red boxes -->
  <g fill="#ef4444" opacity="0.7">
    <rect x="45" y="115" width="60" height="26" rx="4"/><rect x="111" y="115" width="60" height="26" rx="4"/><rect x="177" y="115" width="60" height="26" rx="4"/><rect x="243" y="115" width="60" height="26" rx="4"/><rect x="309" y="115" width="60" height="26" rx="4"/><rect x="375" y="115" width="60" height="26" rx="4"/>
    <rect x="45" y="147" width="60" height="26" rx="4"/><rect x="111" y="147" width="60" height="26" rx="4"/><rect x="177" y="147" width="60" height="26" rx="4"/><rect x="243" y="147" width="60" height="26" rx="4"/><rect x="309" y="147" width="60" height="26" rx="4"/><rect x="375" y="147" width="60" height="26" rx="4"/>
    <rect x="45" y="179" width="60" height="26" rx="4"/><rect x="111" y="179" width="60" height="26" rx="4"/><rect x="177" y="179" width="60" height="26" rx="4"/><rect x="243" y="179" width="60" height="26" rx="4"/><rect x="309" y="179" width="60" height="26" rx="4"/><rect x="375" y="179" width="60" height="26" rx="4"/>
    <rect x="45" y="211" width="60" height="26" rx="4"/><rect x="111" y="211" width="60" height="26" rx="4"/><rect x="177" y="211" width="60" height="26" rx="4"/><rect x="243" y="211" width="60" height="26" rx="4"/><rect x="309" y="211" width="60" height="26" rx="4"/><rect x="375" y="211" width="60" height="26" rx="4"/>
    <rect x="45" y="243" width="60" height="26" rx="4"/><rect x="111" y="243" width="60" height="26" rx="4"/><rect x="177" y="243" width="60" height="26" rx="4"/><rect x="243" y="243" width="60" height="26" rx="4"/><rect x="309" y="243" width="60" height="26" rx="4"/><rect x="375" y="243" width="60" height="26" rx="4"/>
    <rect x="45" y="275" width="60" height="26" rx="4"/><rect x="111" y="275" width="60" height="26" rx="4"/><rect x="177" y="275" width="60" height="26" rx="4"/><rect x="243" y="275" width="60" height="26" rx="4"/><rect x="309" y="275" width="60" height="26" rx="4"/><rect x="375" y="275" width="60" height="26" rx="4"/>
  </g>

  <!-- Stats box -->
  <rect x="45" y="315" width="390" height="65" rx="8" fill="#7f1d1d" opacity="0.9"/>
  <text x="240" y="342" text-anchor="middle" font-size="26" font-weight="800" fill="white">~1,000</text>
  <text x="240" y="362" text-anchor="middle" font-size="12" fill="#fca5a5">tokens/turn - 36 schemas loaded every message</text>

  <!-- Bullet points -->
  <text x="235" y="400" text-anchor="middle" font-size="12" fill="#991b1b">Every schema loaded whether used or not</text>
  <text x="235" y="420" text-anchor="middle" font-size="12" fill="#991b1b">Agents use 5-8 tools, not 36</text>
  <text x="235" y="440" text-anchor="middle" font-size="12" fill="#991b1b">80% of schema tokens are waste</text>
  <text x="235" y="462" text-anchor="middle" font-size="11" fill="#b91c1c">25 turns x 1,000 = 25,000 tokens/session</text>

  <!-- ARROW -->
  <polygon points="460,260 480,245 480,253 510,253 510,267 480,267 480,275" fill="#94a3b8"/>

  <!-- RIGHT CARD -->
  <rect x="515" y="75" width="420" height="420" rx="12" fill="url(#afterBg)" stroke="#86efac" stroke-width="1.5"/>
  <text x="725" y="100" text-anchor="middle" font-size="16" font-weight="700" fill="#16a34a">After: 7 Smart Gateways</text>

  <!-- Gateway boxes - 2 columns, 4 rows -->
  <rect x="535" y="115" width="185" height="42" rx="8" fill="#16a34a" opacity="0.9"/>
  <text x="627" y="135" text-anchor="middle" font-size="13" font-weight="600" fill="white">tp_health</text>
  <text x="627" y="150" text-anchor="middle" font-size="10" fill="#bbf7d0">3 tools inside</text>

  <rect x="730" y="115" width="185" height="42" rx="8" fill="#16a34a" opacity="0.85"/>
  <text x="822" y="135" text-anchor="middle" font-size="13" font-weight="600" fill="white">tp_triage</text>
  <text x="822" y="150" text-anchor="middle" font-size="10" fill="#bbf7d0">4 tools inside</text>

  <rect x="535" y="167" width="185" height="42" rx="8" fill="#16a34a" opacity="0.8"/>
  <text x="627" y="187" text-anchor="middle" font-size="13" font-weight="600" fill="white">tp_watch</text>
  <text x="627" y="202" text-anchor="middle" font-size="10" fill="#bbf7d0">5 tools inside</text>

  <rect x="730" y="167" width="185" height="42" rx="8" fill="#16a34a" opacity="0.75"/>
  <text x="822" y="187" text-anchor="middle" font-size="13" font-weight="600" fill="white">tp_investigate</text>
  <text x="822" y="202" text-anchor="middle" font-size="10" fill="#bbf7d0">4 tools inside</text>

  <rect x="535" y="219" width="185" height="42" rx="8" fill="#16a34a" opacity="0.7"/>
  <text x="627" y="239" text-anchor="middle" font-size="13" font-weight="600" fill="white">tp_correlate</text>
  <text x="627" y="254" text-anchor="middle" font-size="10" fill="#bbf7d0">3 tools inside</text>

  <rect x="730" y="219" width="185" height="42" rx="8" fill="#16a34a" opacity="0.65"/>
  <text x="822" y="239" text-anchor="middle" font-size="13" font-weight="600" fill="white">tp_infra</text>
  <text x="822" y="254" text-anchor="middle" font-size="10" fill="#bbf7d0">4 tools inside</text>

  <rect x="632" y="271" width="185" height="42" rx="8" fill="#16a34a" opacity="0.6"/>
  <text x="724" y="291" text-anchor="middle" font-size="13" font-weight="600" fill="white">tp_manage</text>
  <text x="724" y="306" text-anchor="middle" font-size="10" fill="#bbf7d0">8 tools inside</text>

  <!-- Stats box -->
  <rect x="535" y="325" width="380" height="65" rx="8" fill="#14532d" opacity="0.9"/>
  <text x="725" y="352" text-anchor="middle" font-size="26" font-weight="800" fill="white">~200</text>
  <text x="725" y="372" text-anchor="middle" font-size="12" fill="#86efac">tokens/turn - sub-tools load on demand</text>

  <!-- Bullet points -->
  <text x="725" y="410" text-anchor="middle" font-size="12" fill="#166534">Agent sees 7 categories, not 36 tools</text>
  <text x="725" y="430" text-anchor="middle" font-size="12" fill="#166534">Sub-tools load only when needed</text>
  <text x="725" y="450" text-anchor="middle" font-size="12" fill="#166534">80% reduction, zero behavior change</text>
  <text x="725" y="472" text-anchor="middle" font-size="11" fill="#15803d">25 turns x 200 = 5,000 tokens. Saved: 20,000</text>

  <!-- Bottom tagline -->
  <text x="480" y="510" text-anchor="middle" font-size="13" font-weight="600" fill="#374151">If we preach token savings, we practice it on ourselves first.</text>
</svg>
