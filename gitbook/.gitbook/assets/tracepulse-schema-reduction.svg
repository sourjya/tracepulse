  <text x="235" y="100" text-anchor="middle" font-size="16" font-weight="700" fill="#dc2626">Today: 36 Individual Tools</text>

  <!-- Row 1 - with names -->
  <rect x="45" y="115" width="62" height="30" rx="4" fill="#ef4444" opacity="0.85"/>
  <text x="76" y="134" text-anchor="middle" font-size="8" font-weight="600" fill="white">get_errors</text>

  <rect x="113" y="115" width="62" height="30" rx="4" fill="#ef4444" opacity="0.85"/>
  <text x="144" y="134" text-anchor="middle" font-size="8" font-weight="600" fill="white">verify_fix</text>

  <rect x="181" y="115" width="62" height="30" rx="4" fill="#ef4444" opacity="0.85"/>
  <text x="212" y="134" text-anchor="middle" font-size="8" font-weight="600" fill="white">run_watch</text>

  <rect x="249" y="115" width="62" height="30" rx="4" fill="#ef4444" opacity="0.85"/>
  <text x="280" y="134" text-anchor="middle" font-size="8" font-weight="600" fill="white">health</text>

  <rect x="317" y="115" width="62" height="30" rx="4" fill="#ef4444" opacity="0.85"/>
  <text x="348" y="134" text-anchor="middle" font-size="8" font-weight="600" fill="white">build_err</text>

  <rect x="385" y="115" width="50" height="30" rx="4" fill="#ef4444" opacity="0.85"/>
  <text x="410" y="134" text-anchor="middle" font-size="8" font-weight="600" fill="white">infra</text>

  <!-- Row 2 -->
  <rect x="45" y="151" width="62" height="30" rx="4" fill="#ef4444" opacity="0.75"/>
  <text x="76" y="170" text-anchor="middle" font-size="8" font-weight="600" fill="white">watch</text>

  <rect x="113" y="151" width="62" height="30" rx="4" fill="#ef4444" opacity="0.75"/>
  <text x="144" y="170" text-anchor="middle" font-size="8" font-weight="600" fill="white">context</text>

  <rect x="181" y="151" width="62" height="30" rx="4" fill="#ef4444" opacity="0.75"/>
  <text x="212" y="170" text-anchor="middle" font-size="8" font-weight="600" fill="white">timeline</text>

