<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="beforeBg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#fef2f2"/><stop offset="100%" stop-color="#fee2e2"/></linearGradient>
    <linearGradient id="afterBg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#f0fdf4"/><stop offset="100%" stop-color="#dcfce7"/></linearGradient>
  </defs>

  <rect width="960" height="500" rx="16" fill="#fafafa" stroke="#e5e7eb"/>

  <!-- Title -->
  <text x="480" y="36" text-anchor="middle" font-size="20" font-weight="700" fill="#111">We Practice What We Preach</text>
  <text x="480" y="56" text-anchor="middle" font-size="12" fill="#6b7280">TracePulse cut its own schema overhead by 80%</text>

  <!-- LEFT: Before -->
  <rect x="30" y="75" width="430" height="400" rx="12" fill="url(#beforeBg)" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="245" y="100" text-anchor="middle" font-size="15" font-weight="700" fill="#dc2626">Before: 36 Individual Tools</text>

  <!-- Tool grid (36 small boxes) -->
  <g fill="#ef4444" opacity="0.7">
    <rect x="50" y="120" width="52" height="24" rx="4"/><rect x="108" y="120" width="52" height="24" rx="4"/><rect x="166" y="120" width="52" height="24" rx="4"/><rect x="224" y="120" width="52" height="24" rx="4"/><rect x="282" y="120" width="52" height="24" rx="4"/><rect x="340" y="120" width="52" height="24" rx="4"/>
    <rect x="50" y="150" width="52" height="24" rx="4"/><rect x="108" y="150" width="52" height="24" rx="4"/><rect x="166" y="150" width="52" height="24" rx="4"/><rect x="224" y="150" width="52" height="24" rx="4"/><rect x="282" y="150" width="52" height="24" rx="4"/><rect x="340" y="150" width="52" height="24" rx="4"/>
    <rect x="50" y="180" width="52" height="24" rx="4"/><rect x="108" y="180" width="52" height="24" rx="4"/><rect x="166" y="180" width="52" height="24" rx="4"/><rect x="224" y="180" width="52" height="24" rx="4"/><rect x="282" y="180" width="52" height="24" rx="4"/><rect x="340" y="180" width="52" height="24" rx="4"/>
    <rect x="50" y="210" width="52" height="24" rx="4"/><rect x="108" y="210" width="52" height="24" rx="4"/><rect x="166" y="210" width="52" height="24" rx="4"/><rect x="224" y="210" width="52" height="24" rx="4"/><rect x="282" y="210" width="52" height="24" rx="4"/><rect x="340" y="210" width="52" height="24" rx="4"/>
    <rect x="50" y="240" width="52" height="24" rx="4"/><rect x="108" y="240" width="52" height="24" rx="4"/><rect x="166" y="240" width="52" height="24" rx="4"/><rect x="224" y="240" width="52" height="24" rx="4"/><rect x="282" y="240" width="52" height="24" rx="4"/><rect x="340" y="240" width="52" height="24" rx="4"/>
    <rect x="50" y="270" width="52" height="24" rx="4"/><rect x="108" y="270" width="52" height="24" rx="4"/><rect x="166" y="270" width="52" height="24" rx="4"/><rect x="224" y="270" width="52" height="24" rx="4"/><rect x="282" y="270" width="52" height="24" rx="4"/><rect x="340" y="270" width="52" height="24" rx="4"/>
  </g>
  <text x="50" y="137" font-size="7" fill="white" font-weight="600">get_errors</text>
  <text x="108" y="137" font-size="7" fill="white" font-weight="600">get_build</text>
  <text x="166" y="137" font-size="7" fill="white" font-weight="600">verify_fix</text>
  <text x="224" y="137" font-size="7" fill="white" font-weight="600">watch</text>
  <text x="282" y="137" font-size="7" fill="white" font-weight="600">health</text>
  <text x="340" y="137" font-size="7" fill="white" font-weight="600">infra</text>

  <!-- Stats -->
  <rect x="50" y="310" width="370" height="70" rx="8" fill="#7f1d1d" opacity="0.9"/>
  <text x="235" y="335" text-anchor="middle" font-size="28" font-weight="800" fill="white">~1,000</text>
  <text x="235" y="355" text-anchor="middle" font-size="12" fill="#fca5a5">tokens per turn (36 schemas loaded every message)</text>
  <text x="235" y="372" text-anchor="middle" font-size="11" fill="#fca5a5">25 turns x 1,000 = 25,000 tokens/session wasted on schemas</text>

  <!-- Cost -->
  <text x="245" y="410" text-anchor="middle" font-size="11" fill="#991b1b">Every tool schema loaded whether the agent uses it or not</text>
  <text x="245" y="428" text-anchor="middle" font-size="11" fill="#991b1b">Most agents use 5-8 tools per session, not 36</text>
  <text x="245" y="446" text-anchor="middle" font-size="11" fill="#991b1b">80% of schema tokens are pure waste</text>

  <!-- Arrow -->
  <text x="480" y="260" text-anchor="middle" font-size="36" fill="#94a3b8">-></text>

  <!-- RIGHT: After -->
  <rect x="500" y="75" width="430" height="400" rx="12" fill="url(#afterBg)" stroke="#86efac" stroke-width="1.5"/>
  <text x="715" y="100" text-anchor="middle" font-size="15" font-weight="700" fill="#16a34a">After: 7 Smart Gateways</text>

  <!-- 7 gateway boxes -->
  <rect x="520" y="120" width="130" height="36" rx="8" fill="#16a34a" opacity="0.9"/>
  <text x="585" y="137" text-anchor="middle" font-size="10" font-weight="600" fill="white">tp_health</text>
  <text x="585" y="150" text-anchor="middle" font-size="8" fill="#bbf7d0">3 tools inside</text>

  <rect x="660" y="120" width="130" height="36" rx="8" fill="#16a34a" opacity="0.85"/>
  <text x="725" y="137" text-anchor="middle" font-size="10" font-weight="600" fill="white">tp_triage</text>
  <text x="725" y="150" text-anchor="middle" font-size="8" fill="#bbf7d0">4 tools inside</text>

  <rect x="520" y="166" width="130" height="36" rx="8" fill="#16a34a" opacity="0.8"/>
  <text x="585" y="183" text-anchor="middle" font-size="10" font-weight="600" fill="white">tp_watch</text>
  <text x="585" y="196" text-anchor="middle" font-size="8" fill="#bbf7d0">5 tools inside</text>

  <rect x="660" y="166" width="130" height="36" rx="8" fill="#16a34a" opacity="0.75"/>
  <text x="725" y="183" text-anchor="middle" font-size="10" font-weight="600" fill="white">tp_investigate</text>
  <text x="725" y="196" text-anchor="middle" font-size="8" fill="#bbf7d0">4 tools inside</text>

  <rect x="520" y="212" width="130" height="36" rx="8" fill="#16a34a" opacity="0.7"/>
  <text x="585" y="229" text-anchor="middle" font-size="10" font-weight="600" fill="white">tp_correlate</text>
  <text x="585" y="242" text-anchor="middle" font-size="8" fill="#bbf7d0">3 tools inside</text>

  <rect x="660" y="212" width="130" height="36" rx="8" fill="#16a34a" opacity="0.65"/>
  <text x="725" y="229" text-anchor="middle" font-size="10" font-weight="600" fill="white">tp_infra</text>
  <text x="725" y="242" text-anchor="middle" font-size="8" fill="#bbf7d0">4 tools inside</text>

  <rect x="590" y="258" width="130" height="36" rx="8" fill="#16a34a" opacity="0.6"/>
  <text x="655" y="275" text-anchor="middle" font-size="10" font-weight="600" fill="white">tp_manage</text>
  <text x="655" y="288" text-anchor="middle" font-size="8" fill="#bbf7d0">8 tools inside</text>

  <!-- Stats -->
  <rect x="520" y="310" width="390" height="70" rx="8" fill="#14532d" opacity="0.9"/>
  <text x="715" y="335" text-anchor="middle" font-size="28" font-weight="800" fill="white">~200</text>
  <text x="715" y="355" text-anchor="middle" font-size="12" fill="#86efac">tokens per turn (7 gateways, sub-tools load on demand)</text>
  <text x="715" y="372" text-anchor="middle" font-size="11" fill="#86efac">25 turns x 200 = 5,000 tokens/session. Saved: 20,000</text>

  <!-- Benefits -->
  <text x="715" y="410" text-anchor="middle" font-size="11" fill="#166534">Agent sees 7 clear categories, not 36 individual tools</text>
  <text x="715" y="428" text-anchor="middle" font-size="11" fill="#166534">Sub-tools load only when the agent needs that category</text>
  <text x="715" y="446" text-anchor="middle" font-size="11" fill="#166534">80% schema reduction - zero behavior change required</text>

  <!-- Bottom tagline -->
  <text x="480" y="490" text-anchor="middle" font-size="12" font-weight="600" fill="#374151">If we preach token savings, we practice it on ourselves first.</text>
</svg>
