    <rect x="45" y="219" width="62" height="26" rx="4"/><rect x="113" y="219" width="62" height="26" rx="4"/><rect x="181" y="219" width="62" height="26" rx="4"/><rect x="249" y="219" width="62" height="26" rx="4"/><rect x="317" y="219" width="62" height="26" rx="4"/><rect x="385" y="219" width="50" height="26" rx="4"/>
    <rect x="45" y="251" width="62" height="26" rx="4"/><rect x="113" y="251" width="62" height="26" rx="4"/><rect x="181" y="251" width="62" height="26" rx="4"/><rect x="249" y="251" width="62" height="26" rx="4"/><rect x="317" y="251" width="62" height="26" rx="4"/><rect x="385" y="251" width="50" height="26" rx="4"/>
    <rect x="45" y="283" width="62" height="26" rx="4"/><rect x="113" y="283" width="62" height="26" rx="4"/><rect x="181" y="283" width="62" height="26" rx="4"/><rect x="249" y="283" width="62" height="26" rx="4"/><rect x="317" y="283" width="62" height="26" rx="4"/><rect x="385" y="283" width="50" height="26" rx="4"/>
  </g>
  <text x="235" y="300" text-anchor="middle" font-size="9" fill="white" font-weight="600">+ 24 more tools</text>

  <!-- Stats -->
  <rect x="45" y="320" width="390" height="60" rx="8" fill="#7f1d1d" opacity="0.9"/>
  <text x="240" y="347" text-anchor="middle" font-size="26" font-weight="800" fill="white">~1,000</text>
  <text x="240" y="367" text-anchor="middle" font-size="13" fill="#fca5a5">tokens/turn (all 36 loaded every message)</text>

  <text x="235" y="405" text-anchor="middle" font-size="13" fill="#991b1b">Agents use 5-8 tools, not 36</text>
  <text x="235" y="425" text-anchor="middle" font-size="13" fill="#991b1b">80% of schema tokens are waste</text>
  <text x="235" y="448" text-anchor="middle" font-size="12" fill="#b91c1c">25 turns x 1,000 = 25,000 tokens/session</text>

  <!-- ARROW -->
  <polygon points="460,260 485,245 485,255 515,255 515,265 485,265 485,275" fill="#94a3b8"/>

