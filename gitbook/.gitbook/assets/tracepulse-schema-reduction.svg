  <text x="627" y="155" text-anchor="middle" font-size="11" fill="#bbf7d0">3 tools inside</text>

  <rect x="730" y="118" width="185" height="44" rx="8" fill="#16a34a" opacity="0.85"/>
  <text x="822" y="139" text-anchor="middle" font-size="14" font-weight="600" fill="white">tp_triage</text>
  <text x="822" y="155" text-anchor="middle" font-size="11" fill="#bbf7d0">4 tools inside</text>

  <rect x="535" y="172" width="185" height="44" rx="8" fill="#16a34a" opacity="0.8"/>
  <text x="627" y="193" text-anchor="middle" font-size="14" font-weight="600" fill="white">tp_watch</text>
  <text x="627" y="209" text-anchor="middle" font-size="11" fill="#bbf7d0">5 tools inside</text>

  <rect x="730" y="172" width="185" height="44" rx="8" fill="#16a34a" opacity="0.75"/>
  <text x="822" y="193" text-anchor="middle" font-size="14" font-weight="600" fill="white">tp_investigate</text>
  <text x="822" y="209" text-anchor="middle" font-size="11" fill="#bbf7d0">4 tools inside</text>

  <rect x="535" y="226" width="185" height="44" rx="8" fill="#16a34a" opacity="0.7"/>
  <text x="627" y="247" text-anchor="middle" font-size="14" font-weight="600" fill="white">tp_correlate</text>
  <text x="627" y="263" text-anchor="middle" font-size="11" fill="#bbf7d0">3 tools inside</text>

  <rect x="730" y="226" width="185" height="44" rx="8" fill="#16a34a" opacity="0.65"/>
  <text x="822" y="247" text-anchor="middle" font-size="14" font-weight="600" fill="white">tp_infra</text>
  <text x="822" y="263" text-anchor="middle" font-size="11" fill="#bbf7d0">4 tools inside</text>

  <rect x="632" y="280" width="185" height="44" rx="8" fill="#16a34a" opacity="0.6"/>
  <text x="724" y="301" text-anchor="middle" font-size="14" font-weight="600" fill="white">tp_manage</text>
  <text x="724" y="317" text-anchor="middle" font-size="11" fill="#bbf7d0">8 tools inside</text>

  <!-- Stats -->
  <rect x="535" y="338" width="380" height="60" rx="8" fill="#14532d" opacity="0.9"/>
  <text x="725" y="365" text-anchor="middle" font-size="26" font-weight="800" fill="white">~200</text>
  <text x="725" y="385" text-anchor="middle" font-size="13" fill="#86efac">tokens/turn (sub-tools load on demand)</text>

  <text x="725" y="420" text-anchor="middle" font-size="13" fill="#166534">Agent sees 7 categories, not 36 tools</text>
  <text x="725" y="440" text-anchor="middle" font-size="13" fill="#166534">80% reduction, zero behavior change</text>
  <text x="725" y="463" text-anchor="middle" font-size="12" fill="#15803d">25 turns x 200 = 5,000 tokens. Saved: 20,000</text>

  <!-- Bottom -->
  <text x="480" y="530" text-anchor="middle" font-size="14" font-weight="600" fill="#374151">If we preach token savings, we practice it on ourselves first.</text>
