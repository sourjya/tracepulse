<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="wasteBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fef2f2"/>
      <stop offset="100%" stop-color="#fee2e2"/>
    </linearGradient>
    <linearGradient id="saveBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0fdf4"/>
      <stop offset="100%" stop-color="#dcfce7"/>
    </linearGradient>
    <linearGradient id="barWaste" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
    <linearGradient id="barSave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="960" height="620" rx="16" fill="#fafafa" stroke="#e5e7eb" stroke-width="1"/>

  <!-- Title -->
  <text x="480" y="40" text-anchor="middle" font-size="22" font-weight="700" fill="#111827">The Hidden Cost of Blind Agentic Coding</text>
  <text x="480" y="62" text-anchor="middle" font-size="13" fill="#6b7280">Every wasted token = wasted compute = wasted energy = avoidable carbon emissions</text>

  <!-- LEFT: Without TracePulse -->
  <rect x="30" y="85" width="435" height="500" rx="12" fill="url(#wasteBg)" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="247" y="112" text-anchor="middle" font-size="16" font-weight="700" fill="#dc2626">Without TracePulse</text>
  <text x="247" y="130" text-anchor="middle" font-size="11" fill="#991b1b">Agent iterates blind - reads, guesses, repeats</text>

  <!-- Waste bars -->
  <text x="50" y="165" font-size="11" font-weight="600" fill="#7f1d1d">Token Waste Per Error</text>
  <rect x="50" y="175" width="395" height="28" rx="6" fill="url(#barWaste)" opacity="0.9"/>
  <text x="60" y="194" font-size="13" font-weight="700" fill="white">12,000 tokens</text>
  <text x="380" y="194" font-size="10" fill="white" opacity="0.8">23 tool calls</text>

  <text x="50" y="225" font-size="11" font-weight="600" fill="#7f1d1d">Session Token Budget</text>
  <rect x="50" y="235" width="395" height="28" rx="6" fill="#fecaca"/>
  <rect x="50" y="235" width="237" height="28" rx="6" fill="url(#barWaste)" opacity="0.8"/>
  <text x="60" y="254" font-size="12" font-weight="600" fill="white">59.4% wasted</text>
  <text x="300" y="254" font-size="11" fill="#991b1b">re-reading own work</text>

  <text x="50" y="285" font-size="11" font-weight="600" fill="#7f1d1d">Debug Time Per Session</text>
  <rect x="50" y="295" width="395" height="28" rx="6" fill="url(#barWaste)" opacity="0.7"/>
  <text x="60" y="314" font-size="13" font-weight="700" fill="white">30+ minutes</text>
  <text x="300" y="314" font-size="10" fill="white" opacity="0.8">manual log reading</text>

  <text x="50" y="345" font-size="11" font-weight="600" fill="#7f1d1d">Monthly API Cost (per developer)</text>
  <rect x="50" y="355" width="395" height="28" rx="6" fill="url(#barWaste)" opacity="0.6"/>
  <text x="60" y="374" font-size="13" font-weight="700" fill="white">$500 - $2,000</text>
  <text x="300" y="374" font-size="10" fill="white" opacity="0.8">unsteered agents</text>

  <!-- Environmental impact box -->
  <rect x="50" y="400" width="395" height="170" rx="8" fill="#7f1d1d" opacity="0.9"/>
  <text x="247" y="425" text-anchor="middle" font-size="14" font-weight="700" fill="#fecaca">Environmental Impact at Scale</text>

  <text x="70" y="452" font-size="12" fill="#fca5a5">Data center demand by 2030:</text>
  <text x="350" y="452" font-size="14" font-weight="700" fill="white">945 TWh</text>

  <text x="70" y="478" font-size="12" fill="#fca5a5">DC power growth (AI-driven):</text>
  <text x="350" y="478" font-size="14" font-weight="700" fill="white">+160%</text>

  <text x="70" y="504" font-size="12" fill="#fca5a5">AI inference share of power:</text>
  <text x="350" y="504" font-size="14" font-weight="700" fill="white">>90%</text>

  <text x="70" y="530" font-size="12" fill="#fca5a5">DC CO2 by 2035:</text>
  <text x="350" y="530" font-size="14" font-weight="700" fill="white">320M tonnes</text>

  <text x="247" y="558" text-anchor="middle" font-size="10" fill="#fca5a5" opacity="0.7">Sources: IEA 2025, Goldman Sachs Research, arXiv 2512.03024</text>

  <!-- RIGHT: With TracePulse -->
  <rect x="495" y="85" width="435" height="500" rx="12" fill="url(#saveBg)" stroke="#86efac" stroke-width="1.5"/>
  <text x="712" y="112" text-anchor="middle" font-size="16" font-weight="700" fill="#16a34a">With TracePulse</text>
  <text x="712" y="130" text-anchor="middle" font-size="11" fill="#166534">Structured feedback - one call, exact answer</text>

  <!-- Save bars -->
  <text x="515" y="165" font-size="11" font-weight="600" fill="#14532d">Token Usage Per Error</text>
  <rect x="515" y="175" width="33" height="28" rx="6" fill="url(#barSave)"/>
  <text x="558" y="194" font-size="13" font-weight="700" fill="#16a34a">1,000 tokens</text>
  <text x="700" y="194" font-size="12" font-weight="800" fill="#16a34a">12x reduction</text>

  <text x="515" y="225" font-size="11" font-weight="600" fill="#14532d">Token Budget Efficiency</text>
  <rect x="515" y="235" width="395" height="28" rx="6" fill="#dcfce7"/>
  <rect x="515" y="235" width="356" height="28" rx="6" fill="url(#barSave)" opacity="0.8"/>
  <text x="525" y="254" font-size="12" font-weight="600" fill="white">92% on actual problem-solving</text>

  <text x="515" y="285" font-size="11" font-weight="600" fill="#14532d">Debug Time Per Session</text>
  <rect x="515" y="295" width="66" height="28" rx="6" fill="url(#barSave)" opacity="0.9"/>
  <text x="591" y="314" font-size="13" font-weight="700" fill="#16a34a">&lt;5 minutes</text>
  <text x="720" y="314" font-size="12" font-weight="800" fill="#16a34a">80% faster</text>

  <text x="515" y="345" font-size="11" font-weight="600" fill="#14532d">Monthly API Cost (per developer)</text>
  <rect x="515" y="355" width="132" height="28" rx="6" fill="url(#barSave)" opacity="0.7"/>
  <text x="525" y="374" font-size="13" font-weight="700" fill="white">$50 - $200</text>
  <text x="700" y="374" font-size="12" font-weight="800" fill="#16a34a">90% savings</text>

  <!-- Positive impact box -->
  <rect x="515" y="400" width="395" height="170" rx="8" fill="#14532d" opacity="0.9"/>
  <text x="712" y="425" text-anchor="middle" font-size="14" font-weight="700" fill="#bbf7d0">What TracePulse Saves at Scale</text>

  <text x="535" y="452" font-size="12" fill="#86efac">Tokens saved (1K devs, 10 sess/wk):</text>
  <text x="835" y="452" font-size="14" font-weight="700" fill="white">110M/wk</text>

  <text x="535" y="478" font-size="12" fill="#86efac">GPU inference hours avoided:</text>
  <text x="835" y="478" font-size="14" font-weight="700" fill="white">~40%</text>

  <text x="535" y="504" font-size="12" fill="#86efac">Bugs caught per session:</text>
  <text x="835" y="504" font-size="14" font-weight="700" fill="white">3 real</text>

  <text x="535" y="530" font-size="12" fill="#86efac">Manual log reading eliminated:</text>
  <text x="835" y="530" font-size="14" font-weight="700" fill="white">100%</text>

  <text x="712" y="558" text-anchor="middle" font-size="10" fill="#86efac" opacity="0.7">Measured in live debugging sessions across 3 production projects</text>

  <!-- Bottom tagline -->
  <text x="480" y="608" text-anchor="middle" font-size="13" font-weight="600" fill="#374151">Responsible AI starts with efficient AI. TracePulse makes agentic coding responsible.</text>
</svg>
